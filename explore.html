    <script>
        (function() {
            try {
                const THEMES = [
                    {cyan: '#00f2ff', purple: '#bd00ff'},
                    {cyan: '#00ff7f', purple: '#00b09b'},
                    {cyan: '#ff9900', purple: '#ff4d4d'}
                ];
                let tIndex = parseInt(localStorage.getItem('tournyx_theme_index')) || 0;
                if(THEMES[tIndex]) {
                    document.documentElement.style.setProperty('--accent-cyan', THEMES[tIndex].cyan);
                    document.documentElement.style.setProperty('--accent-purple', THEMES[tIndex].purple);
                    document.documentElement.style.setProperty('--accent-gradient', `linear-gradient(90deg, ${THEMES[tIndex].purple}, ${THEMES[tIndex].cyan})`);
                }
                
                let user = JSON.parse(localStorage.getItem('tournyx_user'));
                if (user && String(user.is_premium).toLowerCase() === 'true') {
                    document.documentElement.classList.add('theme-vip');
                }
            } catch(e) {}
        })();
    </script>

    <style>
        /* --- GLOBAL VARIABLES --- */
        :root {
            --primary-bg: #070311;
            --secondary-bg: #0d061e;
            --card-bg: rgba(20, 10, 35, 0.4);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #00f2ff;
            --accent-purple: #bd00ff;
            --accent-orange: #ff9900;
            --accent-green: #00ff7f;
            --accent-red: #ff4d4d;
            --accent-gradient: linear-gradient(90deg, #7b2cbf, #bd00ff, #00f2ff);
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        html.theme-vip {
            --accent-cyan: #FFD700;
            --accent-purple: #FFA500;
            --accent-gradient: linear-gradient(135deg, #FFDF00, #D4AF37, #FF8C00);
            --card-border: rgba(212, 175, 55, 0.3);
        }

        /* --- HARDWARE ACCELERATED UI (ZERO LAG) --- */
        * { -ms-overflow-style: none !important; scrollbar-width: none !important; box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; background: transparent !important; -webkit-appearance: none !important; }
        
        body { background-color: var(--primary-bg); color: white; font-family: var(--font-body); padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); padding-top: 70px; overflow-x: hidden; min-height: 100vh;}

        .tx-badge {
            font-family: var(--font-head); font-weight: 900; font-style: italic; font-size: 0.9em; letter-spacing: -0.5px;
            background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: inline-flex; align-items: center; justify-content: center;
            filter: drop-shadow(0 0 5px rgba(0,242,255,0.4)); margin: 0 3px; transform: translateZ(0);
        }
        html.theme-vip .tx-badge { filter: drop-shadow(0 0 5px rgba(255,215,0,0.6)); }

        .tx-ticket-composite { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        .tx-ticket-composite .tx-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -46%); font-family: var(--font-head); font-size: 0.38em; font-weight: 900; color: var(--primary-bg) !important; -webkit-text-fill-color: var(--primary-bg) !important; letter-spacing: -0.5px; pointer-events: none; z-index: 2; font-style: normal !important; }

        .search-row, .game-scroll, .tourney-list, .app-footer, .top-header .header-wrapper { max-width: 1200px; margin-left: auto !important; margin-right: auto !important; width: 100%; }

        #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 0%, #15062e 0%, #070311 100%); transform: translateZ(0); }

        .img-loading { background: linear-gradient(90deg, #110822 25%, #1a0a3a 50%, #110822 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite linear; color: transparent !important; }
        .img-loaded { animation: none !important; background: transparent !important; }

        .top-header { 
            position: fixed; top: 0; left: 0; width: 100%; height: 65px; padding: 0 15px; 
            background: rgba(5, 2, 12, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 2000; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); transform: translateZ(0); display: flex; align-items: center;
        }
        .header-wrapper { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 5px;}
        .header-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        .app-logo { width: 30px; height: 30px; border-radius: 50%; object-fit: contain; box-shadow: 0 0 15px var(--accent-purple); border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0;}
        html.theme-vip .app-logo { box-shadow: 0 0 15px #FFD700; border-color: #FFD700;}
        .app-title { font-family: var(--font-head); font-size: 1rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px;}
        
        .desktop-nav { display: none; align-items: center; gap: 25px; }
        .desktop-nav a { color: #aaa; text-decoration: none; font-family: var(--font-head); font-size: 0.95rem; font-weight: bold; transition: 0.2s; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 1px;}
        .desktop-nav a:hover, .desktop-nav a.active { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0,242,255,0.4); }
        html.theme-vip .desktop-nav a:hover, html.theme-vip .desktop-nav a.active { color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.6); }
        @media (min-width: 850px) { .desktop-nav { display: flex; } }

        .header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0;}
        .header-community-icon { color: var(--accent-cyan); font-size: 1.2rem; cursor: pointer; transition: 0.2s; margin-right: 5px; }
        html.theme-vip .header-community-icon { color: #FFD700; }
        .header-community-icon:active { transform: scale(0.9); }
        .header-profile-img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent-cyan); object-fit: cover; cursor: pointer; transition: 0.2s; flex-shrink: 0;}
        html.theme-vip .header-profile-img { border-color: #FFD700; }

        .search-row { display: flex; gap: 10px; padding: 15px; align-items: center; }
        .search-box { position: relative; flex: 1; display: flex; min-width: 0; }
        .search-input { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 12px 15px 12px 40px; border-radius: 50px; color: white; transition: 0.2s; font-size: 0.95rem; font-family: var(--font-body); }
        .search-input:focus { border-color: var(--accent-cyan); outline: none; background: rgba(0,0,0,0.5);}
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; font-size: 1rem; }
        .action-btn { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border-radius: 50px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); color: var(--accent-cyan); transition: 0.2s; flex-shrink: 0; font-size: 1.1rem; }
        html.theme-vip .action-btn { color: #FFD700; }
        .action-btn:active { transform: scale(0.9); }

        .game-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 15px 15px; margin-bottom: 5px; scrollbar-width: none; }
        .game-item { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.03); padding: 8px 18px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: 0.2s; opacity: 0.8; flex-shrink: 0; white-space: nowrap; }
        .game-item.active { opacity: 1; border: 1px solid var(--accent-cyan); background: rgba(0,242,255,0.1); box-shadow: 0 4px 15px rgba(0,242,255,0.2); }
        html.theme-vip .game-item.active { border-color: #FFD700; background: rgba(255,215,0,0.1); box-shadow: 0 4px 15px rgba(255,215,0,0.2); }
        .game-icon { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .game-name { font-size: 0.85rem; font-family: var(--font-head); font-weight: bold; white-space: nowrap; }

        /* --- DYNAMIC GLOWING TOURNAMENT CARDS --- */
    .tourney-list {
        padding: 0 15px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-height: 400px;
    }

    @media (min-width: 768px) {
        .tourney-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
    }

    @media (min-width: 1200px) {
        .tourney-list {
            grid-template-columns: repeat(3, 1fr);
        }
    }        
    .tourney-card { 
            background: var(--card-bg); border-radius: 18px; overflow: hidden; 
            position: relative; transition: all 0.35s ease; cursor: pointer; 
            border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.03);
            transform: translateZ(0); will-change: transform, box-shadow, border-color;
        }
        .tourney-card:hover{
        transform: translateY(-8px);
        box-shadow:
            0 20px 45px rgba(0,0,0,.6),
            0 0 20px rgba(0,242,255,.15);
        }
        .tourney-card{
    animation: cardFadeUp 0.5s ease;
}

@keyframes cardFadeUp{
    from{
        opacity: 0;
    }
    to{
        opacity: 1;
    }
}
       .tourney-card:active {
        transform: translateY(-4px) scale(0.98);
        }
        
        /* Glow Logic - Optimized for 0 Lag */
        .tourney-card.upcoming-glow { border-color: rgba(0, 242, 255, 0.4); }
        .tourney-card.live-glow { border-color: rgba(0, 255, 127, 0.6); animation: cardPulseLive 2s infinite alternate ease-in-out; }
        @keyframes cardPulseLive { 0% { box-shadow: 0 0 5px rgba(0,255,127,0.2); } 100% { box-shadow: 0 0 20px rgba(0,255,127,0.4); } }
        .tourney-card.mega-event { border-color: rgba(255, 215, 0, 0.6); animation: cardPulseMega 2s infinite alternate ease-in-out; }
        @keyframes cardPulseMega { 0% { box-shadow: 0 0 5px rgba(255,215,0,0.2); } 100% { box-shadow: 0 0 25px rgba(255,215,0,0.5); } }
        .tourney-card.is-full { opacity: 0.65; filter: grayscale(70%); background: rgba(30, 30, 30, 0.5) !important; border-color: rgba(255, 255, 255, 0.1) !important; box-shadow: none !important; animation: none !important;}

        .t-banner-wrapper { position: relative; height: 135px; width: 100%; background: #000; overflow: hidden; }
        .t-banner-wrapper::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50px; background: linear-gradient(to bottom, transparent, rgba(15, 7, 25, 0.8)); z-index: 1; }
        .t-banner-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: transform 0.4s ease;; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .tourney-card:hover .t-banner-img { opacity: 1; transform: scale(1.05); }

        .t-status-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: var(--accent-cyan); font-family: var(--font-head); font-size: 0.65rem; font-weight: bold; padding: 4px 10px; border-radius: 50px; border: 1px solid rgba(0,242,255,0.3); display: flex; align-items: center; gap: 5px; z-index: 2; letter-spacing: 0.5px;}
        .pulse-dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); animation: pulseBlue 1.5s infinite alternate; }
        @keyframes pulseBlue { from { opacity:0.5; transform: scale(1); } to { opacity:1; transform: scale(1.2); } }
        
        .t-timer-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); color: white; font-family: var(--font-head); font-size: 0.65rem; font-weight: bold; padding: 4px 10px; border-radius: 50px; z-index: 2; letter-spacing: 0.5px; transition: 0.3s;}
        .t-timer-badge.ending-soon { color: #ff4d4d; border-color: rgba(255,77,77,0.5); animation: urgentPulse 1.5s infinite alternate; }
        @keyframes urgentPulse { 0% { box-shadow: 0 0 0 rgba(255,77,77,0); } 100% { box-shadow: 0 0 15px rgba(255,77,77,0.6); } }
        
        .t-like { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); color: white; padding: 4px 10px; border-radius: 50px; display: flex; align-items: center; justify-content: center; gap: 5px; border: 1px solid rgba(255,255,255,0.1); font-family: var(--font-head); font-size: 0.75rem; font-weight: bold; cursor: pointer; z-index: 5; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .t-like:active { transform: scale(0.8); }
        .t-like.liked i { color: #ff4d4d; animation: pulseLike 0.4s ease-in-out; }
        .t-like.liked { border-color: rgba(255,77,77,0.4); background: rgba(255,77,77,0.15); }
        @keyframes pulseLike { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        
        .t-plat-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.15); color: white; padding: 4px 8px; border-radius: 50px; font-size: 0.65rem; font-family: var(--font-head); font-weight: bold; z-index: 2; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px;}
        
        .t-info-box { padding: 10px 14px 14px 14px; position: relative; z-index: 2; }
        .t-title { font-family: var(--font-head); font-size: 1.05rem; font-weight: 700; line-height: 1.4;; color: white; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; overflow: hidden; text-overflow: ellipsis; word-wrap: break-word; overflow-wrap: break-word; line-height: 1.3; width: 100%; text-shadow: 0 0 5px rgba(255,255,255,0.2); }
        .verified-badge { color: #1da1f2; font-size: 0.85rem; flex-shrink:0; margin-left: 5px; vertical-align: middle;}
        
        .t-details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; word-wrap: break-word; align-items: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .t-detail-item { display: flex; align-items: flex-start; gap: 6px; font-size: 0.8rem; color: #b0b0cc; line-height: 1.3; overflow-wrap: break-word; max-width: 100%;}
        .t-detail-item i { color: var(--accent-purple); width: 14px; text-align: center; margin-top: 2px; flex-shrink: 0;}
        html.theme-vip .t-detail-item i { color: #FFD700; }

        /* Hardware Accelerated Flowing Progress Bar */
        .progress-container { width: 100%; background: rgba(0,0,0,0.4); border-radius: 20px; height: 8px; margin-top: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .progress-bar { height: 100%; border-radius: 20px; background: linear-gradient(90deg, #00f2ff, #bd00ff, #00f2ff); background-size: 200% 100%; animation: gradientFlow 2s linear infinite; position: relative; overflow: hidden; transition: width 0.4s ease-out; }
        @keyframes gradientFlow { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
        
        html.theme-vip .progress-bar { background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700); }
        .progress-bar.filling { background: linear-gradient(90deg, #ff9900, #ff4d4d, #ff9900); }
        .progress-bar.full { background: #ff4d4d; animation: none;}
        
        .slot-text { font-family: var(--font-head); font-size: 0.8rem; color: white; font-weight: bold; letter-spacing: 0.5px;}
        .t-action-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; margin-top: 8px; }
        .t-prize-area { display: flex; flex-direction: column; }
        .t-prize-label { font-size: 0.65rem; color: #888; text-transform: uppercase; font-family: var(--font-head); }
        .t-prize-val { font-size: 1.2rem; font-weight: 900; color: var(--accent-green); text-shadow: 0 0 5px rgba(0,255,127,0.3);}
        
        /* Animated Register Button */
        .join-btn-card { position: relative; overflow: hidden; background: rgba(0,242,255,0.05); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 8px 18px; border-radius: 50px; font-weight: bold; font-size: 0.8rem; font-family: var(--font-head); transition: all 0.3s ease; cursor: pointer; z-index: 1; white-space: nowrap;}
        .join-btn-card::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); animation: btnShine 3s infinite 1s; z-index: -1; }
        @keyframes btnShine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
        .join-btn-card:hover { background: rgba(0,242,255,0.2); box-shadow: 0 0 10px rgba(0,242,255,0.4); transform: translateY(-2px); }
        html.theme-vip .join-btn-card { border-color: #FFD700; color: #FFD700; }
        html.theme-vip .join-btn-card:hover { background: rgba(255,215,0,0.2); box-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .join-btn-card.locked-vip { border-color: #FFD700; color: #FFD700; background: rgba(255,215,0,0.05); }

        /* Advanced Skeleton Loader */
        .skeleton-wrapper { padding: 0; display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite ease-in-out; border-radius: 8px;}
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .s-card { background: var(--card-bg); border-radius: 18px; overflow: hidden; border: 1px solid var(--card-border); display: flex; flex-direction: column; }
        .s-banner { height: 135px; width: 100%; border-radius: 0; }
        .s-content { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .s-line { height: 15px; width: 100%; }
        .s-line.short { width: 60%; }
        .s-btn-area { display: flex; justify-content: space-between; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }

        /* --- BOTTOM SHEETS --- */
        .bottom-sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 5000; display: none; opacity: 0; transition: opacity 0.3s ease; backdrop-filter: blur(8px); }
        .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(15, 7, 30, 0.95); border-radius: 25px 25px 0 0; border-top: 1px solid var(--card-border); padding: 25px 20px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 90vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); }
        .bottom-sheet-overlay.active { display: block; opacity: 1; }
        .bottom-sheet-overlay.active .bottom-sheet { transform: translateY(0); }
        
        @media (min-width: 1024px) {

    .bottom-sheet {

        width: 700px;

        left: 50%;

        transform: translateX(-50%) translateY(100%);

        border-radius: 25px;

        max-height: 85vh;
    }

    .bottom-sheet-overlay.active .bottom-sheet {

        transform: translateX(-50%) translateY(0);
    }
}


        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sheet-title { font-family: var(--font-head); font-size: 1.1rem; color: white; display: flex; align-items: center; gap: 8px; }
        .close-sheet { color: #888; font-size: 1.5rem; cursor: pointer; padding: 5px; transition: 0.2s; }
        
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .f-select-group { display: flex; flex-direction: column; gap: 5px; }
        .f-select-group label { font-size: 0.8rem; color: #888; font-family: var(--font-head); }
        .f-select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 12px; font-family: var(--font-body); font-size: 0.9rem; outline: none; }

        .fee-tags { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; margin-top: 8px;}
        .fee-tag { padding: 8px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50px; font-size: 0.85rem; font-family: var(--font-head); color: #ccc; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; white-space: nowrap; text-align: center;}
