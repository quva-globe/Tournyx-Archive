<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport settings strictly optimized for a native-app feel, preventing pinch-to-zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Welcome to THRYL</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --bg-dark: #050507;
            /* Premium Glassmorphism Colors */
            --card-glass: rgba(18, 18, 22, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.03);
            --input-border: rgba(255, 255, 255, 0.1);
            
            --text-primary: #FFFFFF;
            --text-secondary: #9BA1A6;
            
            --btn-disabled: rgba(255, 255, 255, 0.05);
            --btn-disabled-text: #4A4A5A;
            
            --accent-glow: 0 0 20px rgba(255, 255, 255, 0.2);
            --btn-active: #FFFFFF;
            --btn-active-text: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Removes blue tap highlight on mobile */
        }

        body, html {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100dvh;
            overflow-x: hidden;
            /* Dynamic Breathing Neon Background */
            background: radial-gradient(circle at 15% 20%, rgba(135, 20, 115, 0.5) 0%, transparent 45%),
                        radial-gradient(circle at 85% 60%, rgba(20, 75, 165, 0.45) 0%, transparent 50%),
                        var(--bg-dark);
            background-size: 200% 200%;
            animation: breatheBackground 10s ease-in-out infinite alternate;
        }

        @keyframes breatheBackground {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* --- APP WRAPPER --- */
        .app-container {
            width: 100%;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            /* Default: Centered for Desktop */
            justify-content: center; 
            align-items: center;
        }

        /* --- HEADER & MASCOT --- */
        .header-section {
            text-align: center;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            padding-top: 4vh;
        }

        .header-section h1 {
            font-size: clamp(1.8rem, 5vw, 2.2rem);
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: auto;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
            animation: fadeInDown 0.8s ease-out;
        }

        .mascot-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: -20px; /* Overlaps the card */
            z-index: 3;
            pointer-events: none;
        }

        .mascot-image {
            width: clamp(240px, 65%, 300px);
            filter: drop-shadow(0px 15px 25px rgba(0,0,0,0.6));
            /* The "Alive" Floating Animation */
            animation: floatMascot 4s ease-in-out infinite;
        }

        @keyframes floatMascot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- LOGIN CARD (FROSTED GLASS BOTTOM SHEET) --- */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-glass);
            /* Premium Glass Effect */
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            padding: 32px 24px calc(24px + env(safe-area-inset-bottom));
            position: relative;
            z-index: 4;
            box-shadow: 0 -15px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            
            /* Entry Animation */
            transform: translateY(100px);
            opacity: 0;
            animation: slideUpCard 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards;
        }

        @keyframes slideUpCard {
            to { transform: translateY(0); opacity: 1; }
        }

        .input-label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        /* Phone Input Group */
        .phone-input-group {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .phone-input-group:focus-within {
            border-color: rgba(255, 255, 255, 0.4);
            background-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .country-code {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-right: 14px;
            padding-right: 14px;
            border-right: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
        }

        .country-code i {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .phone-input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.05rem;
            font-weight: 600;
            width: 100%;
            outline: none;
            letter-spacing: 1px;
        }

        .phone-input::placeholder {
            color: #555565;
            font-weight: 500;
            letter-spacing: normal;
        }

        .help-text {
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Primary Button */
        .btn-primary {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            font-size: 1.05rem;
            font-weight: 700;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            background-color: var(--btn-disabled);
            color: var(--btn-disabled-text);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary.active {
            background-color: var(--btn-active);
            color: var(--btn-active-text);
            cursor: pointer;
            box-shadow: var(--accent-glow);
        }

        /* Native App tap scale effect */
        .btn-primary.active:active {
            transform: scale(0.97);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 28px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--input-border);
        }

        .divider span {
            padding: 0 16px;
        }

        /* Social/Secondary Buttons */
        .secondary-buttons {
            display: flex;
            gap: 16px;
        }

        .btn-secondary {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-secondary:active {
            transform: scale(0.95);
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn-secondary img {
            width: 20px;
            height: 20px;
        }

        /* --- FOOTER --- */
        .footer-terms {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.75rem;
            line-height: 1.8;
            margin-top: 24px;
        }

        .footer-terms a {
            color: #C0C0D0;
            text-decoration: none;
            border-bottom: 1px solid rgba(192, 192, 208, 0.4);
            margin: 0 4px;
            transition: color 0.2s ease;
        }

        /* --- MOBILE OPTIMIZATION OVERRIDES --- */
        @media (max-width: 600px) {
            .app-container {
                /* On mobile, push the card to the absolute bottom like a native bottom-sheet */
                justify-content: flex-end; 
            }
            .header-section {
                /* Fills the remaining space above the card */
                flex: 1;
                justify-content: space-between;
                padding-top: 8vh;
            }
            .login-card {
                /* Remove bottom radius for flush fit, maintain top curves */
                border-radius: 36px 36px 0 0;
                border-bottom: none;
                border-left: none;
                border-right: none;
                max-width: 100%;
            }
        }

        /* Desktop specific tweaks */
        @media (min-width: 601px) {
            .login-card {
                border-radius: 32px;
                margin: 0 20px;
            }
            .header-section {
                padding-top: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header & Mascot Area -->
        <div class="header-section">
            <h1>Welcome to THRYL</h1>
            
            <div class="mascot-wrapper">
                <!-- IMPORTANT: Replace the src below with your actual transparent PNG -->
                <img src="https://i.ibb.co/3sX8jZY/placeholder-mascot.png" alt="THRYL Mascot" class="mascot-image" id="mascot">
            </div>
        </div>

        <!-- Form Card Area (Bottom Sheet) -->
        <div class="login-card">
            <label class="input-label" for="phoneNumber">Phone number</label>
            
            <div class="phone-input-group">
                <div class="country-code">
                    +91 <i class="fa-solid fa-caret-down"></i>
                </div>
                <input type="tel" id="phoneNumber" class="phone-input" placeholder="Enter Phone Number" autocomplete="tel">
            </div>
            
            <p class="help-text">We'll send you a code—it helps us keep your account secure.</p>
            
            <button class="btn-primary" id="btnContinue" disabled onclick="handleContinue()">Continue</button>
            
            <div class="divider">
                <span>Or</span>
            </div>
            
            <div class="secondary-buttons">
                <button class="btn-secondary" onclick="handleGoogleLogin()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
                    Google
                </button>
                <button class="btn-secondary" onclick="handleGuestLogin()">
                    <i class="fa-solid fa-user"></i>
                    Guest
                </button>
            </div>

            <!-- Terms Footer moved inside the card so it stays visible on small phones -->
            <div class="footer-terms">
                By Continuing, you agree to our<br>
                <a href="#">Terms of Service</a> 
                <a href="#">Privacy Policy</a> 
                <a href="#">Content Policy</a>
            </div>
        </div>

    </div>

    <script>
        // DOM Elements
        const phoneInput = document.getElementById('phoneNumber');
        const btnContinue = document.getElementById('btnContinue');

        // Advanced Phone Input Validation
        phoneInput.addEventListener('input', function(e) {
            // 1. Strip all non-numeric characters immediately
            let cleaned = this.value.replace(/\D/g, '');
            
            // 2. Intelligent Paste Fix
            if (cleaned.length > 10 && cleaned.startsWith('91')) {
                cleaned = cleaned.substring(2);
            }

            // 3. Force maximum length to exactly 10 digits
            cleaned = cleaned.substring(0, 10);
            
            // 4. Update the input field visually (adds a space after 5 digits for premium look)
            if (cleaned.length > 5) {
                this.value = cleaned.slice(0, 5) + ' ' + cleaned.slice(5);
            } else {
                this.value = cleaned;
            }
            
            // 5. Button activation logic (checking against actual string length without spaces)
            if (cleaned.length === 10) {
                btnContinue.classList.add('active');
                btnContinue.removeAttribute('disabled');
            } else {
                btnContinue.classList.remove('active');
                btnContinue.setAttribute('disabled', 'true');
            }
        });

        // Safe Haptic feedback (Won't crash if browser doesn't support it)
        function triggerHaptic() { 
            try {
                if(navigator.vibrate) navigator.vibrate(15); 
            } catch(e) {}
        }

        // Button Action Handlers
        function handleContinue() {
            if (btnContinue.hasAttribute('disabled')) return;
            
            triggerHaptic();
            // Remove the formatting space to get the raw 10 digits
            const phone = phoneInput.value.replace(/\s/g, ''); 
            
            if (phone.length === 10) {
                // Secure button state to prevent double-clicks
                btnContinue.classList.remove('active');
                btnContinue.setAttribute('disabled', 'true');
                btnContinue.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
                
                // --- ADD YOUR API/OTP LOGIC HERE ---
                console.log("Initiating login for: +91 " + phone);
                
                setTimeout(() => {
                    btnContinue.innerHTML = 'Continue';
                    btnContinue.classList.add('active');
                    btnContinue.removeAttribute('disabled');
                }, 2000);
            }
        }

        function handleGoogleLogin() {
            triggerHaptic();
            console.log("Initiating Google OAuth...");
        }

        function handleGuestLogin() {
            triggerHaptic();
            console.log("Continuing as Guest...");
        }
    </script>
</body>
</html>
