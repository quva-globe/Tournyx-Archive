<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="https://tournyx.in/favicon.ico" sizes="any">
    <link rel="icon" href="https://tournyx.in/favicon.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="https://tournyx.in/apple-touch-icon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Login / Register - Tournyx Esports</title>
    <meta name="description" content="Sign in to your Tournyx account to join premium BGMI and Free Fire esports tournaments.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <style>
        :root {
            --primary-bg: #070311;
            --card-bg: rgba(10, 5, 20, 0.85);
            --input-bg: rgba(5, 2, 12, 0.9);
            --card-border: rgba(0, 242, 255, 0.3);
            --accent-cyan: #00f2ff;
            --accent-purple: #bd00ff;
            --accent-green: #00ff7f;
            --accent-orange: #ff9900;
            --accent-red: #ff4d4d;
            --accent-gradient: linear-gradient(135deg, #bd00ff, #00f2ff);
            --text-main: #ffffff;
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        html.theme-vip {
            --accent-cyan: #FFD700;
            --accent-purple: #FFA500;
            --accent-gradient: linear-gradient(135deg, #FFE87C, #D4AF37, #FF8C00);
            --card-border: rgba(212, 175, 55, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

        html, body {
            background-color: #000; color: var(--text-main); font-family: var(--font-body);
            height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }

        /* --- 3D FIRE LOGO ANIMATION --- */
        #logoIntroOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .fire-logo { width: 120px; height: 120px; border-radius: 22%; animation: fire3DReveal 2.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes fire3DReveal {
            0% { transform: scale(0.1); opacity: 0; filter: drop-shadow(0 0 10px #ff3300) drop-shadow(0 0 30px #ff9900) drop-shadow(0 0 60px #ffcc00); }
            40% { opacity: 1; filter: drop-shadow(0 0 25px #ff3300) drop-shadow(0 0 50px #ff9900) drop-shadow(0 0 90px #ffcc00); }
            80% { transform: scale(1.6); filter: drop-shadow(0 0 15px #ff3300) drop-shadow(0 0 40px #ff9900); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; filter: none; }
        }

        .video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; filter: brightness(0.85); transition: opacity 0.8s ease-in-out; opacity: 1; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 100%, transparent 0%, #000 80%); z-index: 1; pointer-events: none;}
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;}

        /* AAA GAME HUD */
        .hud-top-left { position: absolute; top: 20px; left: 20px; z-index: 6000; font-family: var(--font-body); font-size: 0.65rem; color: rgba(255,255,255,0.7); font-weight: bold; letter-spacing: 1px; text-shadow: 1px 1px 2px black; }
        .hud-top-right { position: absolute; top: 20px; right: 20px; z-index: 6000; display: flex; flex-direction: row; gap: 15px; align-items: flex-start; }
        .hud-tool-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,0.9); font-size: 0.6rem; font-family: var(--font-body); font-weight: bold; cursor: pointer; text-shadow: 1px 1px 3px black; transition: 0.2s; text-transform: uppercase; }
        .hud-tool-btn i { width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; backdrop-filter: blur(5px); transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        .hud-tool-btn:active i { transform: scale(0.9); background: var(--accent-cyan); color: black; border-color: var(--accent-cyan); box-shadow: 0 0 15px var(--accent-cyan);}

        /* --- MAIN UI CONTAINER --- */
        .main-ui-container { width: 100%; height: 100dvh; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; z-index: 10; opacity: 0; transition: opacity 1s ease; padding-bottom: 5vh;}
        .main-ui-container.active { opacity: 1; }

        .auth-card-wrapper {
            width: 100%; max-width: 400px; background: var(--card-bg); backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border); border-radius: 35px 35px 0 0;
            padding: 0 20px 20px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 -15px 40px rgba(0,0,0,0.9); position: relative;
        }

        .logo-overlap { margin-top: -45px; display: flex; flex-direction: column; align-items: center; margin-bottom: 12px;}
        .logo-overlap img { width: 90px; height: 90px; border-radius: 22%; border: 2px solid var(--accent-cyan); box-shadow: 0 10px 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(0,242,255,0.4); background: var(--primary-bg);}
        html.theme-vip .logo-overlap img { border-color: #FFD700; box-shadow: 0 10px 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,215,0,0.4); }
        
        .app-name { font-family: var(--font-head); font-size: 1.8rem; letter-spacing: 2px; font-weight: 900; color: white; text-transform: uppercase; margin-top: 8px; text-align: center; line-height: 1.1;}
        .app-name .esports-text { font-size: 0.55em; letter-spacing: 4px; color: var(--accent-cyan); display: block; margin-top: 2px; text-shadow: 0 0 10px var(--accent-cyan); }
        html.theme-vip .app-name .esports-text { color: #FFD700; text-shadow: 0 0 10px #FFD700; }

        .terms-gate { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #ccc; font-weight: 600; text-shadow: 1px 1px 2px black; font-size: 0.75rem; width: 100%; justify-content: center; margin-bottom: 15px;}
        .terms-gate input { display: none; }
        .terms-checkmark { width: 16px; height: 16px; border: 2px solid #888; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: 0.3s; background: rgba(0,0,0,0.5); flex-shrink: 0;}
        .terms-gate input:checked + .terms-checkmark { border-color: var(--accent-green); background: rgba(0, 255, 127, 0.2); box-shadow: 0 0 10px var(--accent-green); }
        .terms-gate input:checked + .terms-checkmark::after { content: '\f00c'; font-family: "Font Awesome 6 Free"; font-weight: 900; color: var(--accent-green); font-size: 9px; }
        .terms-link { color: var(--accent-cyan); text-decoration: underline; font-weight: bold; }

        /* BUTTONS */
        .auth-buttons-container { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .action-btn { width: 100%; padding: 14px; border-radius: 12px; font-family: var(--font-head); font-size: 0.85rem; font-weight: 900; letter-spacing: 1px; cursor: pointer; transition: 0.3s; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; overflow: hidden; position: relative; z-index: 1;}
        .action-btn::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transform: skewX(-25deg); transition: 0.5s; z-index: -1; }
        .action-btn:hover::after { left: 150%; transition: 0.7s; }
        .action-btn:active { transform: scale(0.96); }

        .social-btn { background: white; color: black; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
        .login-btn { background: var(--accent-gradient); color: white; box-shadow: 0 4px 15px rgba(189,0,255,0.4); }
        html.theme-vip .login-btn { background: linear-gradient(135deg, #FFE87C, #FF8C00); color: black; box-shadow: 0 4px 15px rgba(255,215,0,0.4); }
        .register-btn { background: rgba(0,0,0,0.6); color: white; border: 1px solid var(--accent-cyan); box-shadow: inset 0 0 10px rgba(0,242,255,0.2); }
        html.theme-vip .register-btn { border-color: #FFD700; box-shadow: inset 0 0 10px rgba(255,215,0,0.2); }
        .org-btn { background: transparent; color: var(--accent-orange); font-size: 0.75rem; margin-top: 5px; text-shadow: 0 0 10px rgba(255,153,0,0.5); }

        .divider { display: flex; align-items: center; text-align: center; color: #888; font-size: 0.75rem; font-weight: bold; margin: 5px 0; width: 100%;}
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider span { padding: 0 10px; }

        .credits-footer { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 15px;}
        .footer-center.copyrights { font-size: 0.6rem; text-align: center; font-weight: 600; color: rgba(255, 255, 255, 0.7); }
        .quva-credit { font-size: 0.6rem; color: #aaa; font-family: var(--font-body); letter-spacing: 1px; text-shadow: 1px 1px 2px black;}
        .neon-quva { font-family: var(--font-head); font-weight: 900; color: white; text-shadow: 0 0 8px #00f2ff, 0 0 15px #bd00ff; letter-spacing: 2px;}

        /* Desktop specific tweaks */
        @media (min-width: 769px) {
            .main-ui-container { padding-bottom: 5vh; }
            .auth-card-wrapper { border-radius: 25px; border: 1px solid var(--card-border); max-width: 450px; background: rgba(10, 5, 20, 0.65); padding: 0 30px 30px;}
        }

        /* --- MODALS --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0, 0, 0, 0.85); z-index: 7000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); opacity: 0; transition: opacity 0.3s ease; padding: 15px; }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); width: 100%; max-width: 400px; border-radius: 20px; padding: 25px 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 25px rgba(0,242,255,0.15); transform: scale(0.9); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 90vh; display: flex; flex-direction: column; position: relative; overflow-y: auto; overflow-x: hidden; }
        html.theme-vip .modal-card { box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 25px rgba(255,215,0,0.15); }
        .modal-overlay.active .modal-card { transform: scale(1); }

        .close-modal { position: absolute; top: 15px; right: 18px; font-size: 1.4rem; color: #888; cursor: pointer; transition: 0.3s; z-index: 100; }
        .close-modal:hover { color: var(--accent-red); transform: rotate(90deg) scale(1.1); }
        .modal-title { font-family: var(--font-head); font-size: 1.3rem; color: white; margin-bottom: 20px; text-align: center; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px currentColor; flex-shrink: 0;}

        /* FORMS & INPUTS */
        .input-wrapper { margin-bottom: 15px; width: 100%; }
        .input-group { position: relative; width: 100%; }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; transition: 0.3s; pointer-events: none; font-size: 1rem; z-index: 10;}
        
        .form-control { width: 100%; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px 15px 15px 45px; color: white; font-family: var(--font-body); font-size: 1rem; outline: none; transition: 0.3s; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); font-weight: bold;}
        .form-control:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 242, 255, 0.3), inset 0 0 8px rgba(0,0,0,0.6); }
        html.theme-vip .form-control:focus { border-color: #FFD700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3), inset 0 0 8px rgba(0,0,0,0.6); }
        .form-control:focus + .input-icon { color: var(--accent-cyan); filter: drop-shadow(0 0 5px var(--accent-cyan)); }
        html.theme-vip .form-control:focus + .input-icon { color: #FFD700; filter: drop-shadow(0 0 5px #FFD700); }
        select.form-control { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 15px center; background-size: 20px; }
        
        .pwd-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; cursor: pointer; transition: 0.3s; font-size: 1rem; z-index: 10;}

        /* OTP UI */
        .flex-row { display: flex; gap: 8px; }
        .otp-btn { flex: 1; max-width: 95px; background: rgba(189,0,255,0.15); border: 1px solid var(--accent-purple); color: var(--accent-purple); border-radius: 10px; font-family: var(--font-head); font-size: 0.75rem; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; white-space: nowrap; height: 48px; z-index: 5;}
        .otp-btn:active { transform: scale(0.95); background: var(--accent-purple); color: #fff; }
        .verify-btn { position: absolute; right: 4px; top: 4px; bottom: 4px; background: var(--accent-green); border: none; border-radius: 8px; color: #000; font-weight: 800; padding: 0 15px; cursor: pointer; font-family: var(--font-head); font-size: 0.75rem; transition: 0.2s; z-index: 10;}
        .verify-btn:active { transform: scale(0.95); }
        .verify-btn.verified { background: rgba(0, 255, 127, 0.1); border: 1px solid var(--accent-green); color: var(--accent-green); cursor: default; }

        /* MULTI-STEP SLIDER */
        .slider-window { width: 100%; flex: 1; overflow: hidden; position: relative; min-height: 280px; }
        .slider-track { display: flex; width: 300%; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); height: 100%; align-items: flex-start;}
        .slide-step { width: 33.333%; padding: 2px; flex-shrink: 0; box-sizing: border-box; overflow-x: hidden; overflow-y: auto; max-height: 100%; scrollbar-width: none; }
        
        .step-indicators { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-shrink: 0;}
        .step-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: 0.3s; }
        .step-dot.active { background: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan); transform: scale(1.4); }

        .slide-nav-row { display: flex; gap: 10px; margin-top: 15px; }
        .slide-btn { flex: 1; height: 45px; border: none; border-radius: 10px; font-family: var(--font-head); font-size: 0.85rem; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .slide-btn.next { background: var(--accent-gradient); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .slide-btn.back { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #ccc; }
        .slide-btn:active { transform: scale(0.96); }

        /* --- TOAST & LOADERS --- */
        #customToast { visibility: hidden; min-width: 250px; background-color: var(--accent-cyan); color: #000; text-align: center; border-radius: 50px; padding: 12px 20px; position: fixed; z-index: 10000; left: 50%; bottom: -50px; transform: translateX(-50%); font-family: var(--font-head); font-weight: bold; box-shadow: 0 5px 20px rgba(0,242,255,0.6); opacity: 0; transition: 0.4s; display: flex; align-items: center; justify-content: center; gap: 8px;}
        html.theme-vip #customToast { background-color: #FFD700; box-shadow: 0 5px 20px rgba(255,215,0,0.6); }
        #customToast.show { visibility: visible; opacity: 1; bottom: 35px; }

        .arena-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #040108; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px);}
        .arena-overlay.active { display: flex; animation: fadeInBg 0.3s forwards; }
        .arena-text { font-family: var(--font-head); font-size: 1.8rem; color: #fff; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 20px rgba(0, 242, 255, 0.6); text-align: center; text-transform: uppercase; animation: cinematicEntry 2s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        
        @keyframes fadeInBg { from { opacity: 0; } to { opacity: 1; } }
        @keyframes cinematicEntry { 0% { transform: scale(0.8); opacity: 0; filter: blur(10px); } 20% { transform: scale(1); opacity: 1; filter: blur(0); letter-spacing: 4px; } 80% { transform: scale(1.05); opacity: 1; filter: blur(0); letter-spacing: 6px; } 100% { transform: scale(1.3); opacity: 0; filter: blur(15px); letter-spacing: 10px; } }
        
        /* reCAPTCHA Invisible container */
        #recaptcha-container { display: none; }
    </style>
</head>
<body>

    <div id="logoIntroOverlay">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEipVmqyUEA22VpntZdPCHuXoO_Rjco_cRaNl5CyFa-eehdtgXnHe6JoD8a5svxJRJYZfv_yXwww10T2cL2PHTiXLK-J-nWC1swmMs5RDxGVM8FBSlJORaRiX4YiD8gL8SyM4X1tRyQn_v8MsqQvbU4uEyHEU0qaySP1STWHaBEYuWKyF3-6QovSqJR-8xU/s1024/1000093705.png" alt="Tournyx Logo" class="fire-logo">
    </div>

    <video src="https://tournyx.in/FFBGMICODTRAILER.mp4" poster="https://tournyx.in/hq-fallback-bg.jpg" autoplay loop muted playsinline webkit-playsinline id="bgVideo" class="video-bg"></video>
    <div class="bg-overlay"></div>
    <canvas id="particles-canvas"></canvas>

    <div class="hud-top-left">Beta Version 1.2.0.</div>
    <div class="hud-top-right">
        <div class="hud-tool-btn" onclick="openModal('langModal')"><i class="fa-solid fa-earth-americas"></i><span id="txtLang">Lang</span></div>
        <div class="hud-tool-btn" onclick="openModal('helpModal')"><i class="fa-solid fa-headset"></i><span id="txtHelp">Help</span></div>
        <div class="hud-tool-btn" onclick="openAccountsModal()"><i class="fa-solid fa-users-gear"></i><span id="txtAcc">Accounts</span></div>
    </div>

    <div class="main-ui-container" id="mainUiContainer">
        <div class="auth-card-wrapper">
            <div class="logo-overlap">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEipVmqyUEA22VpntZdPCHuXoO_Rjco_cRaNl5CyFa-eehdtgXnHe6JoD8a5svxJRJYZfv_yXwww10T2cL2PHTiXLK-J-nWC1swmMs5RDxGVM8FBSlJORaRiX4YiD8gL8SyM4X1tRyQn_v8MsqQvbU4uEyHEU0qaySP1STWHaBEYuWKyF3-6QovSqJR-8xU/s1024/1000093705.png" alt="Tournyx Logo">
                <h1 class="app-name">TOURNYX <span class="esports-text">ESPORTS</span></h1>
            </div>

            <label class="terms-gate" onclick="triggerHaptic()">
                <input type="checkbox" id="masterTerms" checked>
                <span class="terms-checkmark"></span>
                <span id="txtTermsText">I agree to the <span class="terms-link" onclick="window.open('terms.html','_blank'); event.stopPropagation();">Terms of Service</span>.</span>
            </label>

            <div id="authButtons" class="auth-buttons-container">
                <button class="action-btn social-btn google-btn" onclick="signInWithGoogle(); triggerHaptic();">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" style="width:18px;"> CONTINUE WITH GOOGLE
                </button>

                <div class="divider"><span>OR</span></div>

                <button class="action-btn login-btn" onclick="checkTermsAndOpen('loginModal')">
                    <i class="fa-solid fa-right-to-bracket"></i> <span id="txtBtnLogin">EMAIL LOGIN</span>
                </button>
                <button class="action-btn register-btn" onclick="checkTermsAndOpen('signupModal')">
                    <i class="fa-solid fa-user-plus"></i> <span id="txtBtnReg">CREATE ACCOUNT</span>
                </button>
                <button class="action-btn org-btn" onclick="checkTermsAndOpen('orgModal')">
                    <i class="fa-solid fa-crown"></i> <span id="txtBtnOrg">ORGANIZER PORTAL</span>
                </button>
            </div>
            
            <div class="credits-footer">
                <div class="footer-center copyrights">© Tournyx Esports private limited | © KRAFTON | © Garena</div>
                <div class="footer-right quva-credit">Powered by <span class="neon-quva">QUVA</span></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-card">
            <i class="fa-solid fa-xmark close-modal" onclick="closeModals()"></i>
            <h2 class="modal-title" style="color:var(--accent-cyan)" id="lblLog">Player Login</h2>
            <form id="playerLoginForm">
                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="email" name="email" id="loginEmail" class="form-control" placeholder="Email Address" required>
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>
                <div class="input-wrapper">
                    <div class="input-group">

                showToast("Failed to send SMS. Verify setup.", true);

        }

            triggerHaptic();
            const otpCode = document.getElementById('regPhoneOtp').value.trim();

            btnLoading('btnVerifyPhoneOtp', 'VERIFYING...');

                await db.auth.signUp({ email: email, password: document.getElementById('regPwd').value });
                
                let newUser = {
                    email: email, phone: document.getElementById('regPhone').value, username: document.getElementById('regUser').value,
                    game: document.getElementById('regGame').value, ign: document.getElementById('regIgn').value, uid: document.getElementById('regUid').value,
                    avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${document.getElementById('regIgn').value}`,
                    role: 'player', is_premium: false, points: 0, rupees: 0
                };
                
                const { error } = await db.from('Users').insert([newUser]);
                if (error) throw error;

                showToast("Account Created! Entering Arena...");
                triggerArenaEntry(newUser, 'index.html');
            } catch(err) { showToast("Signup failed.", true); }
            finally { btnReset('btnSignup'); }
        });

        async function submitOnboarding() {
            triggerHaptic();
            if(!isPhoneVerified) { showToast("Please verify phone number.", true); return; }
            if(!document.getElementById('obIgn').value || !document.getElementById('obUid').value) { showToast("Fill all fields.", true); return; }
            
            btnLoading('btnFinishOnboard', 'SAVING...');

            try {
                let userEmail = pendingOnboardUser.email.toLowerCase();
                let newUser = {
                    email: userEmail, phone: document.getElementById('obPhone').value.trim(), username: document.getElementById('obUsername').value,
                    game: document.getElementById('obGame').value, ign: document.getElementById('obIgn').value, uid: document.getElementById('obUid').value,
                    avatar: pendingOnboardUser.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${document.getElementById('obIgn').value}`,
                    role: 'player', is_premium: false, points: 0, rupees: 0
                };
                
                const { error } = await db.from('Users').insert([newUser]);
                if (error) throw error;

                // Push Notification Trigger via Cloudflare
                await fetch(CLOUDFLARE_WORKER_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'send_push', email: userEmail, title: "Welcome to Tournyx! 🎮", message: "Your esports journey begins now. Win real cash!" })
                }).catch(()=>{});

                showToast("Profile Created! Entering Arena...");
                triggerArenaEntry(newUser, 'index.html');
            } catch (error) { showToast("Error. Phone might exist.", true); btnReset('btnFinishOnboard'); }
        }

        // ==========================================
        // 8. STANDARD LOGIN SUBMITS
        // ==========================================
        document.getElementById('playerLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); triggerHaptic();
            btnLoading('btnLogin', 'AUTHENTICATING...');

            try {
                const { data: dbUser } = await db.from('Users').select('*')
                    .eq('email', document.getElementById('loginEmail').value.trim().toLowerCase())
                    .eq('password', document.getElementById('loginPwd').value).single();
                
                if (dbUser) {
                    if (dbUser.role === 'organizer') showToast("Organizers must use the Organizer Portal.", true);
                    else triggerArenaEntry(dbUser, 'index.html');
                } else { showToast("Invalid Email or Password", true); }
            } catch(err) { showToast("Network Error.", true); }
            finally { btnReset('btnLogin'); }
        });

        document.getElementById('organizerLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); triggerHaptic();
            btnLoading('btnOrgLogin', 'VERIFYING...');

            try {
                const { data: dbUser } = await db.from('Users').select('*')
                    .eq('email', e.target.email.value.trim().toLowerCase())
                    .eq('password', document.getElementById('orgPwd').value).single();
                
                if (dbUser) {
                    if (dbUser.role === 'organizer') triggerArenaEntry(dbUser, 'profile.html');
                    else showToast("You are registered as a Player.", true);
                } else { showToast("Invalid Admin Credentials", true); }
            } catch(err) { showToast("System Error.", true); }
            finally { btnReset('btnOrgLogin'); }
        });

        // ==========================================
        // 9. FINAL ARENA TRANSITION
        // ==========================================
        function triggerArenaEntry(userObj, redirectUrl) {
            if(navigator.vibrate) navigator.vibrate([20, 50, 20]);
            closeModals(true);
            
            localStorage.setItem('tournyx_user', JSON.stringify(userObj));
            
            // Connect OneSignal Push Notifications
            if (window.OneSignalDeferred && userObj.email) {
                OneSignalDeferred.push(async function(OneSignal) {
                    await OneSignal.login(String(userObj.email).trim().toLowerCase());
                });
            }

            document.getElementById('arenaLoader').classList.add('active');
            setTimeout(() => { window.location.href = redirectUrl; }, 1900);
        }
    </script>
</body>
</html>
