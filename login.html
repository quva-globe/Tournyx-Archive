<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="https://tournyx.in/favicon.ico" sizes="any">
    <link rel="icon" href="https://tournyx.in/favicon.png" type="image/png" sizes="192x192">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Login / Register - Tournyx Esports</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            --primary-bg: #070311;
            --card-bg: rgba(10, 5, 20, 0.85);
            --input-bg: rgba(5, 2, 12, 0.9);
            --card-border: rgba(0, 242, 255, 0.3);
            --accent-cyan: #00f2ff;
            --accent-purple: #bd00ff;
            --accent-green: #00ff7f;
            --accent-orange: #ff9900;
            --accent-red: #ff4d4d;
            --accent-gradient: linear-gradient(135deg, #bd00ff, #00f2ff);
            --text-main: #ffffff;
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        html.theme-vip {
            --accent-cyan: #FFD700;
            --accent-purple: #FFA500;
            --accent-gradient: linear-gradient(135deg, #FFE87C, #D4AF37, #FF8C00);
            --card-border: rgba(212, 175, 55, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

        html, body {
            background-color: #000; color: var(--text-main); font-family: var(--font-body);
            height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }

        .video-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; filter: brightness(0.85); transition: opacity 0.8s ease-in-out; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 100%, transparent 0%, #000 80%); z-index: 1; }
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }

        .main-ui-container { width: 100%; height: 100dvh; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; z-index: 10; padding-bottom: 5vh;}

        .auth-card-wrapper {
            width: 100%; max-width: 400px; background: var(--card-bg); backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border); border-radius: 35px 35px 0 0;
            padding: 0 20px 20px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 -15px 40px rgba(0,0,0,0.9); position: relative;
        }

        .logo-overlap { margin-top: -45px; display: flex; flex-direction: column; align-items: center; margin-bottom: 12px;}
        .logo-overlap img { width: 90px; height: 90px; border-radius: 22%; border: 2px solid var(--accent-cyan); box-shadow: 0 10px 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(0,242,255,0.4); background: var(--primary-bg);}
        html.theme-vip .logo-overlap img { border-color: #FFD700; box-shadow: 0 10px 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,215,0,0.4); }
        
        .app-name { font-family: var(--font-head); font-size: 1.8rem; letter-spacing: 2px; font-weight: 900; color: white; text-transform: uppercase; margin-top: 8px; text-align: center; line-height: 1.1;}
        .app-name .esports-text { font-size: 0.55em; letter-spacing: 4px; color: var(--accent-cyan); display: block; margin-top: 2px; text-shadow: 0 0 10px var(--accent-cyan); }
        html.theme-vip .app-name .esports-text { color: #FFD700; text-shadow: 0 0 10px #FFD700; }

        /* MULTI-AUTH BUTTONS */
        .auth-buttons-container { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
        .action-btn { width: 100%; padding: 14px; border-radius: 12px; font-family: var(--font-head); font-size: 0.85rem; font-weight: 900; letter-spacing: 1px; cursor: pointer; transition: 0.3s; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; border: none; }
        .action-btn:active { transform: scale(0.96); }

        .login-btn { background: var(--accent-gradient); color: white; box-shadow: 0 4px 15px rgba(189,0,255,0.4); }
        html.theme-vip .login-btn { background: var(--accent-gradient); color: black; box-shadow: 0 4px 15px rgba(255,215,0,0.4); }
        .register-btn { background: rgba(0,0,0,0.6); color: white; border: 1px solid var(--accent-cyan); box-shadow: inset 0 0 10px rgba(0,242,255,0.2); }
        html.theme-vip .register-btn { border-color: #FFD700; box-shadow: inset 0 0 10px rgba(255,215,0,0.2); }
        
        .social-btn { background: white; color: black; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
        .phone-btn { background: rgba(0, 242, 255, 0.1); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        html.theme-vip .phone-btn { background: rgba(255, 215, 0, 0.1); color: #FFD700; border-color: #FFD700; }

        .divider { display: flex; align-items: center; text-align: center; color: #888; font-size: 0.75rem; font-weight: bold; margin: 15px 0; width: 100%;}
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider span { padding: 0 10px; }

        /* MODALS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0, 0, 0, 0.8); z-index: 5000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); opacity: 0; transition: opacity 0.3s ease; padding: 15px; }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); width: 100%; max-width: 380px; border-radius: 20px; padding: 25px 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 25px rgba(0,242,255,0.15); transform: scale(0.9); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 90vh; display: flex; flex-direction: column; position: relative; overflow-y: auto; overflow-x: hidden; }
        html.theme-vip .modal-card { box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 25px rgba(255,215,0,0.15); }
        .modal-overlay.active .modal-card { transform: scale(1); }

        .close-modal { position: absolute; top: 15px; right: 18px; font-size: 1.4rem; color: #888; cursor: pointer; transition: 0.3s; z-index: 100; }
        .close-modal:hover { color: var(--accent-red); transform: rotate(90deg) scale(1.1); }
        .modal-title { font-family: var(--font-head); font-size: 1.3rem; color: white; margin-bottom: 20px; text-align: center; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px currentColor; flex-shrink: 0;}

        /* FORMS & INPUTS */
        .input-wrapper { margin-bottom: 12px; width: 100%; }
        .input-group { position: relative; width: 100%; }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; transition: 0.3s; pointer-events: none; font-size: 1rem; z-index: 10;}
        
        .form-control { width: 100%; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px 15px 15px 45px; color: white; font-family: var(--font-body); font-size: 1rem; outline: none; transition: 0.3s; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); font-weight: bold;}
        .form-control:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 242, 255, 0.3), inset 0 0 8px rgba(0,0,0,0.6); }
        html.theme-vip .form-control:focus { border-color: #FFD700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .form-control:focus + .input-icon { color: var(--accent-cyan); filter: drop-shadow(0 0 5px var(--accent-cyan)); }
        html.theme-vip .form-control:focus + .input-icon { color: #FFD700; filter: drop-shadow(0 0 5px #FFD700); }
        
        .pwd-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; cursor: pointer; transition: 0.3s; font-size: 1rem; z-index: 10;}
        
        /* SLIDER WINDOW FOR ONBOARDING */
        .slider-window { width: 100%; flex: 1; overflow: hidden; position: relative; min-height: 250px; }
        .slider-track { display: flex; width: 200%; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); height: 100%; align-items: flex-start;}
        .slide-step { width: 50%; padding: 2px; flex-shrink: 0; box-sizing: border-box; }

        #customToast { visibility: hidden; min-width: 250px; background-color: var(--accent-cyan); color: #000; text-align: center; border-radius: 50px; padding: 10px 20px; position: fixed; z-index: 9999; left: 50%; bottom: -50px; transform: translateX(-50%); font-family: var(--font-head); font-weight: bold; box-shadow: 0 5px 20px rgba(0,242,255,0.6); opacity: 0; transition: 0.4s; display: flex; align-items: center; justify-content: center; gap: 8px;}
        html.theme-vip #customToast { background-color: #FFD700; box-shadow: 0 5px 20px rgba(255,215,0,0.6); }
        #customToast.show { visibility: visible; opacity: 1; bottom: 35px; }

        .arena-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #040108; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px);}
        .arena-overlay.active { display: flex; animation: fadeInBg 0.3s forwards; }
        .arena-text { font-family: var(--font-head); font-size: 1.8rem; color: #fff; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 20px rgba(0, 242, 255, 0.6); text-align: center; text-transform: uppercase; animation: cinematicEntry 2s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes fadeInBg { from { opacity: 0; } to { opacity: 1; } }
        @keyframes cinematicEntry { 0% { transform: scale(0.8); opacity: 0; filter: blur(10px); } 20% { transform: scale(1); opacity: 1; filter: blur(0); letter-spacing: 4px; } 80% { transform: scale(1.05); opacity: 1; filter: blur(0); letter-spacing: 6px; } 100% { transform: scale(1.3); opacity: 0; filter: blur(15px); letter-spacing: 10px; } }
    </style>
</head>
<body>

    <video src="https://tournyx.in/FFBGMICODTRAILER.mp4" poster="https://tournyx.in/hq-fallback-bg.jpg" autoplay loop muted playsinline webkit-playsinline id="bgVideo" class="video-bg"></video>
    <div class="bg-overlay"></div>
    <canvas id="particles-canvas"></canvas>

    <div class="main-ui-container">
        <div class="auth-card-wrapper">
            <div class="logo-overlap">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEipVmqyUEA22VpntZdPCHuXoO_Rjco_cRaNl5CyFa-eehdtgXnHe6JoD8a5svxJRJYZfv_yXwww10T2cL2PHTiXLK-J-nWC1swmMs5RDxGVM8FBSlJORaRiX4YiD8gL8SyM4X1tRyQn_v8MsqQvbU4uEyHEU0qaySP1STWHaBEYuWKyF3-6QovSqJR-8xU/s1024/1000093705.png" alt="Tournyx Logo">
                <h1 class="app-name">TOURNYX <span class="esports-text">ESPORTS</span></h1>
            </div>

            <div id="authButtons" class="auth-buttons-container">
                <button class="action-btn social-btn google-btn" onclick="signInWithGoogle(); triggerHaptic();">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google"> CONTINUE WITH GOOGLE
                </button>
                <button class="action-btn social-btn phone-btn" onclick="openModal('phoneAuthModal'); triggerHaptic();">
                    <i class="fa-solid fa-phone"></i> CONTINUE WITH PHONE
                </button>

                <div class="divider"><span>OR</span></div>

                <button class="action-btn login-btn" onclick="openModal('loginModal'); triggerHaptic();">
                    <i class="fa-solid fa-envelope"></i> EMAIL LOGIN
                </button>
                <button class="action-btn register-btn" onclick="openModal('signupModal'); triggerHaptic();">
                    <i class="fa-solid fa-user-plus"></i> EMAIL SIGNUP
                </button>
            </div>
            
            <div style="font-size: 0.65rem; color: #888; text-align: center; margin-top: 20px; font-weight: bold; letter-spacing: 1px;">
                By continuing, you agree to our <a href="terms.html" style="color:var(--accent-cyan);">Terms of Service</a>.
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-card">
            <i class="fa-solid fa-xmark close-modal" onclick="closeModals()"></i>
            <h2 class="modal-title" style="color:var(--accent-cyan)">Player Login</h2>
            <form id="playerLoginForm">
                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="email" name="email" id="loginEmail" class="form-control" placeholder="Email Address" required>
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>
                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="password" name="password" id="loginPwd" class="form-control" placeholder="Password" required>
                        <i class="fa-solid fa-lock input-icon"></i>
                        <i class="fa-solid fa-eye pwd-toggle" onclick="togglePwd('loginPwd', this)"></i>
                    </div>
                </div>
                <button type="submit" class="action-btn login-btn" id="btnLogin" style="margin-top: 10px;">ENTER ARENA <i class="fa-solid fa-arrow-right"></i></button>
            </form>
            <div style="text-align:center; margin-top:15px; font-size:0.75rem;">
                <a href="#" style="color:var(--accent-orange); font-weight:bold; text-decoration:none;" onclick="closeModals(); openModal('orgModal');">Switch to Organizer Login</a>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="signupModal">
        <div class="modal-card">
            <i class="fa-solid fa-xmark close-modal" onclick="closeModals()"></i>
            <h2 class="modal-title" style="color:var(--accent-purple)">Create Account</h2>
            <form id="playerSignupForm">
                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>
                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="password" name="password" id="regPwd" class="form-control" placeholder="Create Password" required minlength="6">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <i class="fa-solid fa-eye pwd-toggle" onclick="togglePwd('regPwd', this)"></i>
                    </div>
                </div>
                <button type="submit" class="action-btn register-btn" id="btnSignup" style="margin-top: 10px; background: var(--accent-gradient); border: none;">CREATE ACCOUNT <i class="fa-solid fa-check"></i></button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="phoneAuthModal">
        <div class="modal-card">
            <i class="fa-solid fa-xmark close-modal" onclick="closeModals()"></i>
            <h2 class="modal-title" style="color:var(--accent-cyan)">Phone Login</h2>
            
            <div id="phoneStep1">
                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="tel" id="phoneNumberInput" class="form-control" placeholder="+91 9876543210" required>
                        <i class="fa-solid fa-phone input-icon"></i>
                    </div>
                </div>
                <div id="recaptcha-container"></div>
                <button type="button" class="action-btn login-btn" id="btnSendPhoneOtp" onclick="sendPhoneOTP()" style="margin-top: 10px;">SEND OTP <i class="fa-solid fa-paper-plane"></i></button>
            </div>

            <div id="phoneStep2" style="display:none;">
                <p style="color:#aaa; font-size:0.85rem; text-align:center; margin-bottom: 15px;">Enter the code sent to your phone.</p>
                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="number" id="phoneOtpInput" class="form-control" placeholder="Enter 6-digit OTP" required>
                        <i class="fa-solid fa-message input-icon"></i>
                    </div>
                </div>
                <button type="button" class="action-btn login-btn" id="btnVerifyPhoneOtp" onclick="verifyPhoneOTP()" style="margin-top: 10px; background: var(--accent-green); color: black;">VERIFY OTP <i class="fa-solid fa-check-double"></i></button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="googleOnboardModal">
        <div class="modal-card">
            <h2 class="modal-title" style="color:var(--accent-orange)">Complete Profile</h2>
            <p style="color:#aaa; font-size:0.85rem; text-align:center; margin-bottom: 15px;">Welcome to Tournyx! Let's set up your gamer profile.</p>
            
            <form id="onboardForm">
                <div class="slider-window">
                    <div class="slider-track" id="onboardSliderTrack">
                        
                        <div class="slide-step">
                            <div class="input-wrapper">
                                <div class="input-group">
                                    <input type="text" id="obUsername" class="form-control" placeholder="Display Name (e.g. John Doe)" required>
                                    <i class="fa-solid fa-user input-icon"></i>
                                </div>
                            </div>
                            <div class="input-wrapper">
                                <div class="input-group">
                                    <select id="obGame" class="form-control" required>
                                        <option value="" disabled selected>Select Primary Game</option>
                                        <option value="BGMI">BGMI</option>
                                        <option value="Free Fire">Free Fire</option>
                                        <option value="COD Mobile">Call of Duty Mobile</option>
                                    </select>
                                    <i class="fa-solid fa-crosshairs input-icon"></i>
                                </div>
                            </div>
                            <button type="button" class="action-btn" style="background: rgba(255,255,255,0.1); color: white; margin-top:10px;" onclick="nextOnboardSlide()">NEXT <i class="fa-solid fa-arrow-right"></i></button>
                        </div>

                        <div class="slide-step">
                            <div class="input-wrapper">
                                <div class="input-group">
                                    <input type="text" id="obIgn" class="form-control" placeholder="In-Game Name (IGN)" required>
                                    <i class="fa-solid fa-gamepad input-icon"></i>
                                </div>
                            </div>
                            <div class="input-wrapper">
                                <div class="input-group">
                                    <input type="number" id="obUid" class="form-control" placeholder="Game UID (Numbers)" required>
                                    <i class="fa-solid fa-id-card input-icon"></i>
                                </div>
                            </div>
                            <div style="display:flex; gap:10px; margin-top:10px;">
                                <button type="button" class="action-btn" style="flex:1; background: transparent; border: 1px solid #666;" onclick="prevOnboardSlide()"><i class="fa-solid fa-arrow-left"></i></button>
                                <button type="button" class="action-btn login-btn" style="flex:3;" id="btnFinishOnboard" onclick="submitOnboarding()">FINISH <i class="fa-solid fa-check"></i></button>
                            </div>
                        </div>

                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="orgModal">
        <div class="modal-card" style="border-color: var(--accent-orange); box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 25px rgba(255,153,0,0.15);">
            <i class="fa-solid fa-xmark close-modal" onclick="closeModals()"></i>
            <h2 class="modal-title" style="color:var(--accent-orange)"><i class="fa-solid fa-crown"></i> Organizer Hub</h2>
            <form id="organizerLoginForm">
                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="email" name="email" class="form-control" placeholder="Organizer Email" required>
                        <i class="fa-solid fa-envelope input-icon" style="color:var(--accent-orange)"></i>
                    </div>
                </div>
                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="password" name="password" id="orgPwd" class="form-control" placeholder="Access Key" required>
                        <i class="fa-solid fa-key input-icon" style="color:var(--accent-orange)"></i>
                        <i class="fa-solid fa-eye pwd-toggle" onclick="togglePwd('orgPwd', this)"></i>
                    </div>
                </div>
                <button type="submit" class="action-btn" id="btnOrgLogin" style="margin-top: 10px; background:linear-gradient(90deg, #ff9900, #ff4d4d); color: white; border: none;">VERIFY ADMIN <i class="fa-solid fa-bolt"></i></button>
            </form>
        </div>
    </div>

    <div id="arenaLoader" class="arena-overlay">
        <div class="arena-text" id="txtLoading">ENTERING THE ARENA</div>
    </div>

    <div id="customToast"><i class="fa-solid fa-circle-exclamation"></i> <span id="toastMsg">Alert</span></div>

    <script>

            t.innerHTML = `<i class="fa-solid ${isError ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i> ${msg}`;
            t.style.backgroundColor = isError ? "var(--accent-red)" : (document.documentElement.classList.contains('theme-vip') ? "#FFD700" : "var(--accent-cyan)"); 
            t.style.color = "black"; t.className = "show"; triggerHaptic(); 
            setTimeout(()=>t.className="", 3500); 
        }
        function openModal(id) { closeModals(true); document.getElementById(id).classList.add('active'); }
        function closeModals(internalCall = false) { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }
        function togglePwd(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") { input.type = "text"; icon.classList.replace("fa-eye", "fa-eye-slash"); } 
            else { input.type = "password"; icon.classList.replace("fa-eye-slash", "fa-eye"); }
        }

        // --- VIDEO BACKGROUND FIX ---
        document.addEventListener("DOMContentLoaded", () => {
            const bgVideo = document.getElementById('bgVideo');
            if (bgVideo) {
                bgVideo.style.opacity = '0.01'; // iOS un-pause hack
                const playPromise = bgVideo.play();
                if (playPromise !== undefined) playPromise.catch(() => {});
                setTimeout(() => { bgVideo.style.opacity = '1'; }, 1000);
            }
        });

        // ==========================================
        // 🚀 GOOGLE AUTHENTICATION LOGIC (SUPABASE)
        // ==========================================
        async function signInWithGoogle() {
            try {
                // Supabase handles the OAuth popup/redirect instantly
                const { data, error } = await db.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: window.location.origin + '/login.html' }
                });
                if (error) throw error;
            } catch (error) {
                showToast("Google Login Failed.", true);
            }
        }

        // Catch the redirect when they come back from Google
        db.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_IN' && session) {
                const email = session.user.email;
                const name = session.user.user_metadata?.full_name || "Gamer";
                const avatar = session.user.user_metadata?.avatar_url || "";

                // Check our actual Users table to see if they finished onboarding
                const { data: dbUser, error } = await db.from('Users').select('*').eq('email', email).single();
                
                if (dbUser) {
                    // User already exists, log them right into the app!
                    triggerArenaEntry(dbUser, 'index.html');
                } else {
                    // New user! Needs to complete profile.
                    pendingOnboardUser = { email: email, username: name, avatar: avatar, auth_method: 'google' };
                    closeModals(true);
                    openModal('googleOnboardModal');
                }
            }
        });

        // ==========================================
        // 📱 FREE PHONE AUTHENTICATION (FIREBASE)
        // ==========================================
        function openPhoneAuth() {
            closeModals(true);
            openModal('phoneAuthModal');
            // Setup Firebase Recaptcha (Invisible)
            if(!window.recaptchaVerifier) {
                window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
            }
        }

        async function sendPhoneOTP() {
            triggerHaptic();
            const phoneStr = document.getElementById('phoneNumberInput').value.trim();
            if(phoneStr.length < 10) { showToast("Enter a valid phone number", true); return; }
            
            // Format phone for Firebase
            const formattedPhone = phoneStr.startsWith('+') ? phoneStr : '+91' + phoneStr;
            
            const btn = document.getElementById('btnSendPhoneOtp');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> SENDING...`;
            btn.disabled = true;

            try {
                const appVerifier = window.recaptchaVerifier;
                phoneConfirmationResult = await fbAuth.signInWithPhoneNumber(formattedPhone, appVerifier);
                
                document.getElementById('phoneStep1').style.display = 'none';
                document.getElementById('phoneStep2').style.display = 'block';
                pendingOnboardUser = { phone: formattedPhone, auth_method: 'phone' };
                showToast("OTP sent via SMS!");
            } catch (error) {
                console.error("SMS Error", error);
                showToast("Failed to send SMS. Try again.", true);
                btn.innerHTML = `SEND OTP <i class="fa-solid fa-paper-plane"></i>`;
                btn.disabled = false;
            }
        }

        async function verifyPhoneOTP() {
            triggerHaptic();
            const otpCode = document.getElementById('phoneOtpInput').value.trim();
            if(otpCode.length < 6) { showToast("Enter 6-digit OTP", true); return; }

            const btn = document.getElementById('btnVerifyPhoneOtp');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> VERIFYING...`;
            btn.disabled = true;

            try {
                // Verify with Firebase
                const result = await phoneConfirmationResult.confirm(otpCode);
                const userPhone = result.user.phoneNumber;

                // Check Supabase to see if this phone number exists in our DB
                const { data: dbUser, error } = await db.from('Users').select('*').eq('phone', userPhone).single();

                if (dbUser) {
                    triggerArenaEntry(dbUser, 'index.html');
                } else {
                    closeModals(true);
                    openModal('googleOnboardModal'); // Re-use onboarding modal
                }
            } catch (error) {
                showToast("Invalid OTP code.", true);
                btn.innerHTML = `VERIFY OTP <i class="fa-solid fa-check-double"></i>`;
                btn.disabled = false;
            }
        }

        // ==========================================
        // 📝 ONBOARDING MODAL SLIDER (NEW USERS)
        // ==========================================
        let obStep = 1;
        function nextOnboardSlide() {
            triggerHaptic();
            if(!document.getElementById('obUsername').value || !document.getElementById('obGame').value) {
                showToast("Please fill all fields.", true); return;
            }
            obStep = 2;
            document.getElementById('onboardSliderTrack').style.transform = `translateX(-50%)`;
        }
        function prevOnboardSlide() {
            triggerHaptic();
            obStep = 1;
            document.getElementById('onboardSliderTrack').style.transform = `translateX(0%)`;
        }

        async function submitOnboarding() {
            triggerHaptic();
            if(!document.getElementById('obIgn').value || !document.getElementById('obUid').value) {
                showToast("Please fill all fields.", true); return;
            }

            const btn = document.getElementById('btnFinishOnboard');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> SAVING...`;
            btn.disabled = true;

            try {
                // Construct final user object
                let newUser = {
                    email: pendingOnboardUser.email || `${pendingOnboardUser.phone.replace('+','')}@tournyx.com`,
                    phone: pendingOnboardUser.phone || null,
                    username: document.getElementById('obUsername').value,
                    game: document.getElementById('obGame').value,
                    ign: document.getElementById('obIgn').value,
                    uid: document.getElementById('obUid').value,
                    avatar: pendingOnboardUser.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${document.getElementById('obIgn').value}`,
                    role: 'player',
                    is_premium: false,
                    points: 0, rupees: 0
                };

                // Insert into Supabase
                const { error } = await db.from('Users').insert([newUser]);
                if (error) throw error;

                showToast("Profile Created! Entering Arena...");
                triggerArenaEntry(newUser, 'index.html');
            } catch (error) {
                showToast("Error creating profile.", true);
                btn.innerHTML = `FINISH <i class="fa-solid fa-check"></i>`;
                btn.disabled = false;
            }
        }

        // ==========================================
        // ✉️ MANUAL EMAIL LOGIN / REGISTRATION
        // ==========================================
        document.getElementById('playerLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            triggerHaptic();
            const btn = document.getElementById('btnLogin');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            btn.disabled = true;

            const email = e.target.email.value;
            const password = e.target.password.value;

            try {
                const { data: dbUser, error } = await db.from('Users').select('*').eq('email', email).eq('password', password).single();
                if (dbUser) {
                    if (dbUser.role === 'organizer') showToast("Organizers must use the Organizer Portal.", true);
                    else triggerArenaEntry(dbUser, 'index.html');
                } else { showToast("Invalid Email or Password", true); }
            } catch(err) { showToast("Login failed.", true); }
            finally { btn.innerHTML = `ENTER ARENA <i class="fa-solid fa-arrow-right"></i>`; btn.disabled = false; }
        });

        document.getElementById('playerSignupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            triggerHaptic();
            const btn = document.getElementById('btnSignup');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            btn.disabled = true;

            const email = e.target.email.value;
            const password = e.target.password.value;

            try {
                // For manual signup, we check if exists
                const { data: existing } = await db.from('Users').select('email').eq('email', email).single();
                if (existing) { showToast("Email already exists. Please login.", true); return; }

                pendingOnboardUser = { email: email, password: password, auth_method: 'manual' };
                
                // Use Supabase native Auth to create the user securely
                await db.auth.signUp({ email: email, password: password });

                closeModals(true);
                openModal('googleOnboardModal'); // Reuse the onboarding slider!
            } catch(err) { showToast("Signup failed.", true); }
            finally { btn.innerHTML = `CREATE ACCOUNT <i class="fa-solid fa-check"></i>`; btn.disabled = false; }
        });

        // ==========================================
        // 👑 ORGANIZER LOGIN
        // ==========================================
        document.getElementById('organizerLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            triggerHaptic();
            const btn = document.getElementById('btnOrgLogin');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            btn.disabled = true;

            const email = e.target.email.value;
            const password = e.target.password.value;

            try {
                const { data: dbUser, error } = await db.from('Users').select('*').eq('email', email).eq('password', password).single();
                if (dbUser) {
                    if (dbUser.role === 'organizer') triggerArenaEntry(dbUser, 'profile.html');
                    else showToast("You are registered as a Player.", true);
                } else { showToast("Invalid Admin Credentials", true); }
            } catch(err) { showToast("Login failed.", true); }
            finally { btn.innerHTML = `VERIFY ADMIN <i class="fa-solid fa-bolt"></i>`; btn.disabled = false; }
        });

        // --- FINAL ARENA TRANSITION ---
        function triggerArenaEntry(userObj, redirectUrl) {
            if(navigator.vibrate) navigator.vibrate([20, 50, 20]);
            closeModals(true);
            
            // Save Session locally so other pages pick it up
            localStorage.setItem('tournyx_user', JSON.stringify(userObj));
            
            // Link Push Notifications
            if (window.OneSignalDeferred && userObj.email) {
                OneSignalDeferred.push(async function(OneSignal) {
                    await OneSignal.login(String(userObj.email).trim().toLowerCase());
                });
            }

            const loader = document.getElementById('arenaLoader');
            loader.classList.add('active');
            
            setTimeout(() => { window.location.href = redirectUrl; }, 1900);
        }
    </script>
</body>
</html>
