<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 🌐 OPEN GRAPH / WHATSAPP LINK PREVIEWS -->
    <meta property="og:title" content="TOURNYX // The System is Optimizing">
    <meta property="og:description" content="The servers are upgrading. Enter the Free Fire Max Reflex Range, train your aim, and claim 100 TX Points before the system reboots!">
    <meta property="og:image" content="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiJvPTY_y_XU-0Lwbnjwm7961lCDkSlQh2MtCWHunFVX6WS7WCprCtkPyB334BU_-4vGsP0NseDQf4NPBEOIxqjk7VZQqZUHpnLb4Bw-c1UeXQy2M9DzNrNdYt_aL0GEb1AlTPupC5zEjJiP3Ci0Oxk-wdg5TF5cs8_UNSe3uTT1BE884je3iXr8QlMjx8/s1200/epic-tournyx-banner.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <title>TOURNYX | System Initialization</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-bg: #070311;
            --accent-cyan: #00f2ff;
            --accent-purple: #bd00ff;
            --accent-gold: #FFD700;
            --glass-bg: rgba(10, 6, 25, 0.75);
            --glass-border: rgba(0, 242, 255, 0.2);
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        /* 🛑 ZERO SCROLL VIEWPORT LOCK */
        html, body {
            width: 100vw; height: 100vh; height: 100dvh; 
            overflow: hidden; background-color: var(--primary-bg);
            color: #fff; font-family: var(--font-body);
        }

        /* 🎬 HARDWARE ACCELERATED VIDEO BACKGROUND */
        .video-bg-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden;
            background: #000;
        }
        .video-bg-file {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.35; pointer-events: none;
        }
        /* Dark Gradient Overlay */
        .video-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(7,3,17,0.4) 0%, rgba(7,3,17,0.9) 100%);
        }

        /* 📱 MAIN APP SHELL */
        .app-shell {
            display: flex; flex-direction: column; width: 100%; height: 100%;
            padding: calc(10px + env(safe-area-inset-top)) 20px calc(15px + env(safe-area-inset-bottom));
            position: relative; z-index: 10;
        }

        /* 🔝 HEADER: LOGO (LEFT) & TIMER (RIGHT) */
        header {
            display: flex; justify-content: space-between; align-items: center; width: 100%; height: 60px; flex-shrink: 0;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand img { width: 35px; height: 35px; border-radius: 8px; filter: drop-shadow(0 0 10px var(--accent-cyan)); }
        .brand-text { font-family: var(--font-head); font-weight: 900; font-size: 1.2rem; letter-spacing: 2px; color: white; text-shadow: 0 0 8px var(--accent-cyan); }

        .sys-timer {
            display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.6);
            border: 1px solid var(--glass-border); padding: 6px 12px; border-radius: 8px;
            backdrop-filter: blur(10px); box-shadow: 0 0 15px rgba(0,242,255,0.2);
        }
        .time-block { display: flex; align-items: baseline; gap: 2px; }
        .time-val { font-family: var(--font-head); font-weight: 900; font-size: 1.1rem; color: var(--accent-gold); }
        .time-lbl { font-size: 0.65rem; color: #aaa; font-weight: bold; }
        .time-sep { color: var(--accent-cyan); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* 🎛️ CENTER CONTENT */
        main {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            width: 100%; max-width: 600px; margin: 0 auto;
        }

        /* Banner Frame */
        .sys-banner-wrap {
            width: 100%; padding: 6px; background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            margin-bottom: 20px; position: relative;
        }
        .sys-banner { width: 100%; height: auto; max-height: 200px; object-fit: cover; border-radius: 12px; }
        
        /* Fading Professional Text */
        .fade-message {
            font-family: var(--font-head); font-size: clamp(0.9rem, 4vw, 1.1rem); font-weight: 700;
            color: white; text-transform: uppercase; letter-spacing: 1.5px; text-align: center;
            margin-bottom: 30px; animation: professionalFade 3.5s ease-in-out infinite;
        }
        @keyframes professionalFade {
            0%, 100% { opacity: 0.4; text-shadow: none; }
            50% { opacity: 1; text-shadow: 0 0 15px var(--accent-cyan); color: var(--accent-cyan); }
        }

        /* The Solo Leveling Action Button */
        .btn-awaken {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            border: 2px solid #fff; border-radius: 12px; padding: 14px 30px;
            color: #fff; font-family: var(--font-head); font-weight: 900; font-size: 1.1rem;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.5); transition: 0.3s;
            display: flex; align-items: center; gap: 10px;
        }
        .btn-awaken:active { transform: scale(0.95); }
        .btn-awaken:hover { box-shadow: 0 0 40px rgba(189, 0, 255, 0.8); }

        /* 🔗 FOOTER SOCIALS */
        footer {
            height: 50px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        }
        .foot-text { font-family: var(--font-head); font-size: 0.7rem; color: #888; letter-spacing: 1px; text-transform: uppercase; }
        .social-row { display: flex; gap: 20px; }
        .social-row i { font-size: 1.3rem; color: #ccc; transition: 0.3s; cursor: pointer; }
        .social-row i:hover { color: var(--accent-cyan); filter: drop-shadow(0 0 8px var(--accent-cyan)); transform: scale(1.2); }

        /* 🎯 POPUP MINI GAME MODAL */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 5000; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .game-box {
            background: #0d061e; border: 2px solid var(--accent-cyan); border-radius: 16px;
            width: 90%; max-width: 400px; padding: 20px; position: relative;
            box-shadow: 0 0 50px rgba(0,242,255,0.3); transform: scale(0.9); transition: 0.3s;
        }
        .modal-overlay.active .game-box { transform: scale(1); }

        .close-btn {
            position: absolute; top: 10px; right: 15px; color: #888; font-size: 1.2rem; cursor: pointer;
        }
        
        /* Game Arena */
        .game-header { text-align: center; font-family: var(--font-head); font-weight: 900; color: var(--accent-gold); margin-bottom: 10px; letter-spacing: 1px;}
        
        .arena {
            width: 100%; height: 220px; background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgV-7qK-tYyE9KqO_R6Y8Y0c4mR9H_V8Xw0ZJb2P7uR9zBwP2X3Qn4Z4U6Y7H8L9J0K1M2N3O4P5Q6R7S8T9U0V1W2X3Y4Z5A6B7C8D9E0F1G2H/s800/ffmax-bg.jpg') center/cover;
            border: 2px solid #333; border-radius: 10px; position: relative; overflow: hidden; cursor: crosshair;
        }
        .arena::after { content: ''; position: absolute; inset:0; background: rgba(0,0,0,0.4); } /* Darken BG */

        /* The Headshot Target */
        .target {
            position: absolute; width: 40px; height: 40px; top: 50%; left: 50%;
            background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjD3C4B5A6F7G8H9I0J1K2L3M4N5O6P7Q8R9S0T1U2V3W4X5Y6Z7A8B9C0D1E2F3G4H5I6J7K8L9M0N1O2P3Q4R5S6T7U8V9W0X1Y2Z/s100/headshot-icon.png') center/contain no-repeat;
            transform: translate(-50%, -50%); z-index: 5; transition: top 0.2s, left 0.2s; filter: drop-shadow(0 0 5px red);
        }

        .hud { display: flex; justify-content: space-between; margin-top: 10px; font-family: var(--font-mono); font-weight: bold; font-size: 0.9rem;}
        .score-text { color: var(--accent-cyan); }
        .ammo-text { color: #ff4d4d; }

        /* Win State */
        .win-state { display: none; text-align: center; animation: popIn 0.4s ease; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0;} 100% { transform: scale(1); opacity: 1;} }
        
        .win-title { font-family: var(--font-head); color: var(--accent-green); font-size: 1.5rem; font-weight: 900; margin-bottom: 5px;}
        .win-sub { font-size: 0.85rem; color: #ccc; margin-bottom: 15px; line-height: 1.4;}
        
        .btn-share {
            width: 100%; background: #25D366; color: white; border: none; padding: 12px; border-radius: 8px;
            font-family: var(--font-head); font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }

        #customToast { visibility: hidden; min-width: 250px; background-color: var(--accent-gold); color: #000; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 9999; left: 50%; bottom: 30px; transform: translateX(-50%); font-family: var(--font-head); font-weight: bold; font-size: 0.85rem; box-shadow: 0 4px 15px rgba(255,215,0,0.5);}
        #customToast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <!-- 🎬 VIDEO BACKGROUND -->
    <div class="video-bg-container">
        <!-- Add your cool gaming loop video link here -->
        <video class="video-bg-file" autoplay loop muted playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-laser-lights-background-loop-41740-large.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- 📱 MAIN APP UI (LOCKED IN 1 VIEWPORT) -->
    <div class="app-shell">
        
        <!-- 🔝 HEADER -->
        <header>
            <div class="brand">
                <img src="1000093706.png" alt="Tournyx Logo" onerror="this.src='https://ui-avatars.com/api/?name=TX&background=000&color=00f2ff'">
                <div class="brand-text">TOURNYX</div>
            </div>
            
            <div class="sys-timer" id="systemTimer">
                <div class="time-block"><span class="time-val" id="tHrs">00</span><span class="time-lbl">H</span></div>
                <div class="time-sep">:</div>
                <div class="time-block"><span class="time-val" id="tMin">00</span><span class="time-lbl">M</span></div>
                <div class="time-sep">:</div>
                <div class="time-block"><span class="time-val" id="tSec">00</span><span class="time-lbl">S</span></div>
            </div>
        </header>

        <!-- 🎛️ CENTER CONTENT -->
        <main>
            <div class="sys-banner-wrap">
                <!-- Using Free Fire Max banner as requested -->
                <img src="1000148754.jpg" class="sys-banner" alt="System Update" onerror="this.src='https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiJvPTY_y_XU-0Lwbnjwm7961lCDkSlQh2MtCWHunFVX6WS7WCprCtkPyB334BU_-4vGsP0NseDQf4NPBEOIxqjk7VZQqZUHpnLb4Bw-c1UeXQy2M9DzNrNdYt_aL0GEb1AlTPupC5zEjJiP3Ci0Oxk-wdg5TF5cs8_UNSe3uTT1BE884je3iXr8QlMjx8/s1264/1000094210.jpg'">
            </div>

            <!-- Fading Text instead of scroll -->
            <div class="fade-message">
                <i class="fa-solid fa-server"></i> Server under maintenance<br>Come back again soon
            </div>

            <!-- The Highlighted Game Button -->
            <button class="btn-awaken" onclick="openGame()">
                <i class="fa-solid fa-crosshairs"></i> Play FF-Max Reflex Trainer
            </button>
        </main>

        <!-- 🔗 FOOTER SOCIALS -->
        <footer>
            <div class="foot-text">Follow us for live updates</div>
            <div class="social-row">
                <i class="fa-brands fa-instagram" onclick="window.open('https://instagram.com','_blank')"></i>
                <i class="fa-brands fa-whatsapp" onclick="window.open('https://whatsapp.com','_blank')"></i>
                <i class="fa-brands fa-discord" onclick="window.open('https://discord.com','_blank')"></i>
                <i class="fa-brands fa-youtube" onclick="window.open('https://youtube.com','_blank')"></i>
            </div>
        </footer>
    </div>

    <!-- 🎯 POPUP MINI GAME: ONE-TAP TRAINER -->
    <div class="modal-overlay" id="gameModal">
        <div class="game-box">
            <i class="fa-solid fa-xmark close-btn" onclick="closeGame()"></i>
            
            <div id="gameState">
                <div class="game-header">ONE-TAP REFLEX TRAINING</div>
                
                <div class="arena" id="arena" onclick="missShot(event)">
                    <!-- The Target that jumps around -->
                    <div class="target" id="target" onclick="hitTarget(event)"></div>
                </div>

                <div class="hud">
                    <div class="score-text">HEADSHOTS: <span id="scoreVal">0</span>/10</div>
                    <div class="ammo-text">MISSED: <span id="missVal">0</span></div>
                </div>
            </div>

            <!-- Win State Marketing Arbitrage -->
            <div class="win-state" id="winState">
                <i class="fa-solid fa-gem" style="font-size:3rem; color:var(--accent-cyan); filter:drop-shadow(0 0 15px cyan); margin-bottom:15px;"></i>
                <div class="win-title">SYSTEM AWAKENED!</div>
                <div class="win-sub">You have excellent reflexes! You've unlocked <b>100 TX Points</b>. Share this page with your squad to claim them instantly!</div>
                <button class="btn-share" onclick="shareToClaim()"><i class="fa-brands fa-whatsapp"></i> Share & Claim Points</button>
            </div>

        </div>
    </div>

    <div id="customToast">Notification</div>

    <!-- ⚙️ JAVASCRIPT ENGINE -->
    <script>
        /* --- 1. COUNTDOWN TIMER LOGIC --- */
        // Set maintenance end time to 2 hours from now for demo purposes
        let endTime = Date.now() + (2 * 60 * 60 * 1000); 

        function updateTimer() {
            let now = Date.now();
            let diff = endTime - now;

            if (diff <= 0) {
                // When timer ends, ping server or redirect to explore.html
                document.getElementById('tHrs').innerText = "00";
                document.getElementById('tMin').innerText = "00";
                document.getElementById('tSec').innerText = "00";
                document.querySelector('.fade-message').innerHTML = "<i class='fa-solid fa-bolt'></i> SYSTEM ONLINE - ENTERING...";
                document.querySelector('.fade-message').style.color = "#00ff7f";
                setTimeout(() => { window.location.href = "/explore"; }, 2000);
                return;
            }

            let h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            let s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('tHrs').innerText = h < 10 ? "0" + h : h;
            document.getElementById('tMin').innerText = m < 10 ? "0" + m : m;
            document.getElementById('tSec').innerText = s < 10 ? "0" + s : s;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        /* --- 2. MINI GAME LOGIC --- */
        let score = 0;
        let misses = 0;
        const target = document.getElementById('target');
        const arena = document.getElementById('arena');

        function openGame() {
            if(navigator.vibrate) navigator.vibrate(50);
            score = 0; misses = 0;
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('missVal').innerText = misses;
            document.getElementById('gameState').style.display = 'block';
            document.getElementById('winState').style.display = 'none';
            document.getElementById('gameModal').classList.add('active');
            moveTarget();
        }

        function closeGame() {
            if(navigator.vibrate) navigator.vibrate(50);
            document.getElementById('gameModal').classList.remove('active');
        }

        function moveTarget() {
            let maxX = arena.clientWidth - 40;
            let maxY = arena.clientHeight - 40;
            let randomX = Math.floor(Math.random() * maxX);
            let randomY = Math.floor(Math.random() * maxY);
            
            target.style.left = randomX + 20 + 'px';
            target.style.top = randomY + 20 + 'px';
        }

        function hitTarget(e) {
            e.stopPropagation(); // Prevent triggering missShot
            if(navigator.vibrate) navigator.vibrate(30);
            score++;
            document.getElementById('scoreVal').innerText = score;
            
            if (score >= 10) {
                // WIN CONDITION
                if(navigator.vibrate) navigator.vibrate([50, 50, 100]);
                document.getElementById('gameState').style.display = 'none';
                document.getElementById('winState').style.display = 'block';
            } else {
                moveTarget();
            }
        }

        function missShot(e) {
            if (e.target === arena) {
                misses++;
                document.getElementById('missVal').innerText = misses;
            }
        }

        /* --- 3. VIRAL SHARE ENGINE --- */
        function shareToClaim() {
            if(navigator.vibrate) navigator.vibrate(50);
            let shareUrl = window.location.origin;
            let shareText = "Tournyx is upgrading! I just scored 100 TX Points in the Reflex Trainer. Beat my score and claim yours before the servers open! 🎯🔥 " + shareUrl;

            if (navigator.share) {
                navigator.share({
                    title: 'Tournyx System Awakening',
                    text: shareText,
                    url: shareUrl
                }).then(() => {
                    showToast("Points Claimed! Check your wallet when servers open.");
                    setTimeout(closeGame, 1500);
                }).catch(console.error);
            } else {
                // Fallback for PC / Unsupported browsers
                let waLink = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText);
                window.open(waLink, '_blank');
                showToast("Points Claimed! Check your wallet when servers open.");
                setTimeout(closeGame, 1500);
            }
        }

        function showToast(msg) {
            const t = document.getElementById('customToast');
            t.innerText = msg;
            t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
        }
    </script>
</body>
</html>
